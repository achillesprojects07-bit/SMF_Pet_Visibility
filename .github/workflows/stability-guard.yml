name: SMF Stability Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify protected runtime files exist
        shell: bash
        run: |
          set -euo pipefail
          required=(
            index.html auth.js field.html app.js field-day-filter.js stability.js styles.css brand.css config.js sw.js
            admin.html admin.css admin.js
            client.html client.css client.js
            backend/ApiV5.gs api-worker/worker.js
            photo-v6/worker.js photo-v6/migrations/0001_photo_v6.sql photo-v6/wrangler.toml
            DATA_PRESERVATION.md AUDIT.md
          )
          for f in "${required[@]}"; do
            test -f "$f" || { echo "ERROR: protected file missing: $f"; exit 1; }
          done

      - name: JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail
          node --check auth.js
          node --check app.js
          node --check field-day-filter.js
          node --check stability.js
          node --check admin.js
          node --check client.js
          node --check api-worker/worker.js
          node --check photo-v6/worker.js

      - name: Verify live V6 photo recovery remains safe
        shell: bash
        run: |
          set -euo pipefail
          grep -q "6.0.0-field-photo-v6" app.js
          grep -q "smf_pending_photo_v6" app.js
          grep -q "smf_photo_v6_session" app.js
          grep -q "PHOTO_API_BASE_URL" config.js
          grep -q "/v6/photo/preflight" app.js
          grep -q "/v6/photo/" app.js
          grep -q "/status" app.js
          grep -q "/sync" app.js
          grep -q "sendV6Photo" app.js
          grep -q "recoverAfterUploadInterruption" app.js
          grep -q "METADATA_PENDING" app.js
          grep -q "DRIVE_SAVED" app.js
          grep -q "the image will not be uploaded again" app.js
          grep -q "xhr.upload.onprogress" app.js
          grep -q "xhr.timeout=120000" app.js
          grep -q "photoSlot.uploading" stability.js
          grep -q "beforeunload" stability.js
          grep -q "smf-v6-shell-1" sw.js

      - name: Verify V6 backend safety invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q "METADATA_PENDING" photo-v6/worker.js
          grep -q "V6_UPLOAD:" photo-v6/worker.js
          grep -q "createsFolders:false" photo-v6/worker.js
          grep -q "Existing POE folder not found" photo-v6/worker.js
          grep -q "LIVE / Team / Area / Store Name" photo-v6/worker.js
          grep -q "appsScriptPhotoPath:false" photo-v6/worker.js
          grep -q "/v6/ready" photo-v6/worker.js
          grep -q "Verify Google OAuth refresh token" .github/workflows/deploy-photo-v6.yml
          grep -q "Verify live V6 health and Google readiness" .github/workflows/deploy-photo-v6.yml

      - name: Verify legacy backend recovery path remains intact
        shell: bash
        run: |
          set -euo pipefail
          grep -q "prepareExternalPhotoV5" backend/ApiV5.gs
          grep -q "commitExternalPhotoFastV5" backend/ApiV5.gs
          grep -q "alreadyCommitted" backend/ApiV5.gs
          grep -q "tryLock" backend/ApiV5.gs
          grep -q "getSize()||0)<=0" backend/ApiV5.gs
          grep -q "authorized store folder" backend/ApiV5.gs
          grep -q "signResume" api-worker/worker.js
          grep -q "verifyResume" api-worker/worker.js
          grep -q "pendingMetadata" api-worker/worker.js

      - name: Verify field deployment coverage
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'field-day-filter.js' field.html
          grep -q 'field-day-filter.js' sw.js
          grep -q 'stability.js' sw.js
          grep -q 'field-day-filter.js' .github/workflows/deploy-pages.yml
          grep -q 'config.js' .github/workflows/deploy-pages.yml
          grep -q 'app.js' .github/workflows/deploy-pages.yml

      - name: Block destructive Drive operations in all photo code
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE "setTrashed\\(true\\)|Drive\\.Files\\.(remove|delete)|files\\.delete|\\.removeFile\\(" backend/ApiV5.gs api-worker/worker.js photo-v6/worker.js; then
            echo "ERROR: destructive Google Drive operation detected in photo path."
            exit 1
          fi

      - name: Verify preservation contract remains explicit
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Existing V4_POE rows" DATA_PRESERVATION.md
          grep -q "Existing V4_PHOTOS rows" DATA_PRESERVATION.md
          grep -q "Existing physical POE files" DATA_PRESERVATION.md
          grep -q "No physical Drive file is deleted" DATA_PRESERVATION.md
