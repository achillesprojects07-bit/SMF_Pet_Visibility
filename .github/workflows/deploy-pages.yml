name: Deploy SMF v5 Frontend

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "auth.js"
      - "field.html"
      - "app.js"
      - "admin.html"
      - "admin.css"
      - "admin.js"
      - "client.html"
      - "client.css"
      - "client.js"
      - "styles.css"
      - "brand.css"
      - "config.js"
      - "manifest.webmanifest"
      - "sw.js"
      - ".nojekyll"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/stability-guard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
