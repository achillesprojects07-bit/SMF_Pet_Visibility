name: Deploy SMF Photo V6

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "photo-v6/**"
      - ".github/workflows/deploy-photo-v6.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: photo-v6
    steps:
      - uses: actions/checkout@v4

      - name: Verify required secrets
        shell: bash
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          POE_ROOT_FOLDER_ID: ${{ secrets.POE_ROOT_FOLDER_ID }}
          SCRIPT_API_URL: ${{ secrets.SCRIPT_API_URL }}
          BRIDGE_SECRET: ${{ secrets.BRIDGE_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for n in GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_REFRESH_TOKEN GOOGLE_SHEET_ID POE_ROOT_FOLDER_ID SCRIPT_API_URL BRIDGE_SECRET CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!n:-}" ]; then
              echo "Missing required GitHub secret: $n"
              exit 1
            fi
          done

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Find or create D1 transaction database
        id: d1
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          NAME="smf-pet-visibility-photo-v6"
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")

          LIST=$(curl -fsS "${AUTH[@]}" "$API")
          OK=$(echo "$LIST" | jq -r '.success')
          if [ "$OK" != "true" ]; then
            echo "$LIST" | jq -c '{success,errors,messages}'
            exit 1
          fi

          ID=$(echo "$LIST" | jq -r --arg NAME "$NAME" '.result[]? | select(.name == $NAME) | (.uuid // .id // empty)' | head -n1)

          if [ -z "$ID" ]; then
            CREATED=$(curl -fsS -X POST "${AUTH[@]}" --data "$(jq -nc --arg name "$NAME" '{name:$name}')" "$API")
            OK=$(echo "$CREATED" | jq -r '.success')
            if [ "$OK" != "true" ]; then
              echo "$CREATED" | jq -c '{success,errors,messages}'
              exit 1
            fi
            ID=$(echo "$CREATED" | jq -r '.result.uuid // .result.id // empty')
          fi

          if [ -z "$ID" ]; then
            echo "Could not determine D1 database ID"
            exit 1
          fi

          echo "Using D1 database: $NAME"
          echo "database_id=$ID" >> "$GITHUB_OUTPUT"

      - name: Build runtime Wrangler config
        shell: bash
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          POE_ROOT_FOLDER_ID: ${{ secrets.POE_ROOT_FOLDER_ID }}
        run: |
          cat > wrangler.runtime.toml <<EOF
          name = "smf-pet-visibility-photo-v6"
          main = "worker.js"
          compatibility_date = "2026-09-04"
          compatibility_flags = ["nodejs_compat"]

          [vars]
          ALLOWED_ORIGIN = "https://achillesprojects07-bit.github.io"
          SMF_MODE = "LIVE"
          GOOGLE_SHEET_ID = "$GOOGLE_SHEET_ID"
          POE_ROOT_FOLDER_ID = "$POE_ROOT_FOLDER_ID"

          [[d1_databases]]
          binding = "DB"
          database_name = "smf-pet-visibility-photo-v6"
          database_id = "${{ steps.d1.outputs.database_id }}"
          migrations_dir = "migrations"
          EOF

      - name: Apply D1 migrations
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 migrations apply smf-pet-visibility-photo-v6 --remote --config wrangler.runtime.toml

      - name: Deploy V6 photo Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: photo-v6
          wranglerVersion: "4"
          command: deploy --config wrangler.runtime.toml
          secrets: |
            GOOGLE_OAUTH_CLIENT_ID
            GOOGLE_OAUTH_CLIENT_SECRET
            GOOGLE_OAUTH_REFRESH_TOKEN
            SCRIPT_API_URL
            BRIDGE_SECRET
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          SCRIPT_API_URL: ${{ secrets.SCRIPT_API_URL }}
          BRIDGE_SECRET: ${{ secrets.BRIDGE_SECRET }}

      - name: Verify live V6 health and Google readiness
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://smf-pet-visibility-photo-v6.achilles-projects07.workers.dev"
          for i in 1 2 3 4 5; do
            HEALTH=$(curl -fsS "$BASE/v6/health" || true)
            if [ "$(echo "$HEALTH" | jq -r '.ok // false')" = "true" ] && [ "$(echo "$HEALTH" | jq -r '.appsScriptPhotoPath // true')" = "false" ]; then
              break
            fi
            if [ "$i" = "5" ]; then
              echo "V6 health check failed: $HEALTH"
              exit 1
            fi
            sleep 2
          done
          READY=$(curl -fsS "$BASE/v6/ready")
          echo "$READY" | jq -e '.ok == true and .directGoogle == true and .requiredColumnsOk == true and .createsFolders == false and .folderPattern == "LIVE / Team / Area / Store Name"' >/dev/null
          echo "V6 live readiness verified."
