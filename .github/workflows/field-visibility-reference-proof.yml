name: Field Visibility Reference Proof

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Syntax check
        run: node --check migration/field-visibility-reference-proof.mjs

      - name: Run isolated proof tests
        run: node migration/field-visibility-reference-proof.mjs --self-test

      - name: Fetch preserved v5 Field reference
        run: |
          git fetch origin v5-field-pilot --depth=1
          git show origin/v5-field-pilot:api/src/domain.js > /tmp/v5-field-domain.js

      - name: Prove intended Active filter semantics from independent implementation
        run: node migration/field-visibility-reference-proof.mjs

      - name: Fail closed on current legacy runtime
        run: |
          node - <<'NODE'
          const r=require('./migration/field-visibility-reference-output/field-visibility-reference-proof.json');
          if(r.intendedSemanticsProven!==true) throw new Error('Reference Active filtering was not proven');
          if(r.currentLegacyRuntimeCertified!==false) throw new Error('Legacy runtime must remain uncertified');
          if(r.activeFalseAcceptedAsProductionContainmentBoundary!==false) throw new Error('Active=FALSE must not be accepted as production containment yet');
          if(r.productionApplyMustRemainLocked!==true) throw new Error('Production APPLY must remain locked');
          NODE

      - name: Ensure executor remains hard locked
        run: |
          grep -q 'const PRODUCTION_APPLY_UNLOCKED=false;' migration/manual-one-store-apply-executor.mjs
          grep -q 'const FIELD_VISIBILITY_CONTAINMENT_PROVEN=false;' migration/manual-one-store-apply-executor.mjs

      - name: Ensure frozen upload/runtime files match main
        run: |
          git fetch origin main --depth=1
          changed="$(git diff --name-only origin/main HEAD -- app.js photo-v6/worker.js api-worker/worker.js backend/ApiV5.gs)"
          test -z "$changed" || { echo "$changed"; exit 1; }

      - name: Upload proof report
        uses: actions/upload-artifact@v4
        with:
          name: field-visibility-reference-proof
          path: migration/field-visibility-reference-output/field-visibility-reference-proof.json
