<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b4ea2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>SMF Pet Visibility</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="brand.css">
</head>
<body>
<header class="topbar brandedTopbar">
  <a class="fieldBrand" href="./" aria-label="San Miguel Foods Pet Visibility">
    <svg class="fieldLogo" viewBox="0 0 310 120" role="img" aria-label="San Miguel Foods">
      <path d="M145 5c-25 10-40 25-48 47l20 36c0-31 11-50 39-61z" fill="#38b928"/>
      <path d="M116 88c8-31 30-47 67-45l-8 39c-4 20-22 31-59 28z" fill="#ed1c24"/>
      <text x="0" y="80" font-family="Arial Black,Arial,sans-serif" font-size="38" font-weight="900" fill="#0754bd">SAN MIGUEL</text>
      <text x="68" y="116" font-family="Arial Black,Arial,sans-serif" font-size="38" font-weight="900" fill="#0754bd">FOODS</text>
    </svg>
    <span><strong>SMF PET VISIBILITY</strong><small id="version">v5</small></span>
  </a>
  <div class="topActions"><a class="adminLink" href="admin.html">Admin</a><button id="logoutBtn" class="secondary hidden">Sign out</button></div>
</header>
<main class="shell">
  <section id="loginView" class="card">
    <h1>Field Sign In</h1>
    <p class="small">Use your existing SMF field access code. Your Google Sheets records and existing POE stay unchanged.</p>
    <form id="loginForm">
      <input id="codeInput" autocomplete="one-time-code" placeholder="SMF field access code" required>
      <button id="loginBtn" type="submit">Sign in</button>
    </form>
    <div id="loginError" class="error"></div>
  </section>
  <section id="homeView" class="hidden">
    <section class="card"><div class="row"><div><h1 id="hello">Deployment</h1><div id="teamLine" class="small"></div></div><button id="refreshBtn" class="secondary">Refresh</button></div></section>
    <div id="days"></div>
  </section>
  <section id="storeView" class="hidden">
    <button id="backBtn" class="back">‹ Back to schedule</button>
    <div id="storeBody"></div>
  </section>
</main>
<div id="toast" class="toast hidden"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
