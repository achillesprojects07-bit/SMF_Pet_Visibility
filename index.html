<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b4ea2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>SMF Pet Visibility</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="brand.css">
</head>
<body>
<header class="topbar brandedTopbar">
  <a class="fieldBrand" href="./" aria-label="San Miguel Foods Pet Visibility">
    <svg class="fieldLogo" viewBox="0 0 310 120" role="img" aria-label="San Miguel Foods">
      <path d="M145 5c-25 10-40 25-48 47l20 36c0-31 11-50 39-61z" fill="#38b928"/>
      <path d="M116 88c8-31 30-47 67-45l-8 39c-4 20-22 31-59 28z" fill="#ed1c24"/>
      <text x="0" y="80" font-family="Arial Black,Arial,sans-serif" font-size="38" font-weight="900" fill="#0754bd">SAN MIGUEL</text>
      <text x="68" y="116" font-family="Arial Black,Arial,sans-serif" font-size="38" font-weight="900" fill="#0754bd">FOODS</text>
    </svg>
    <span><strong>SMF PET VISIBILITY</strong><small>Deployment Portal</small></span>
  </a>
</header>
<main class="shell">
  <section class="card" style="max-width:640px;margin:36px auto 0">
    <h1>Sign In</h1>
    <p class="small">Enter your SMF access code. The system will automatically open the correct workspace for Field Team, Admin, or Client access.</p>
    <form id="universalLoginForm">
      <input id="universalCode" autocomplete="one-time-code" placeholder="SMF access code" required>
      <button id="universalLoginBtn" type="submit">Sign in</button>
    </form>
    <div id="universalLoginStatus" class="small" style="margin-top:10px"></div>
    <div id="universalLoginError" class="error"></div>
  </section>
</main>
<script src="config.js"></script>
<script src="auth.js"></script>
</body>
</html>
